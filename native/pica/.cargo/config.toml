# A cdylib on musl must not link the C runtime statically, or the NIF cannot be loaded.
# See https://github.com/rust-lang/rust/issues/59302 and rustler_precompiled's TROUBLESHOOTING.md.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
