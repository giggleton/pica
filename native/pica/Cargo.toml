[package]
name = "pica"
version = "0.1.0"
edition = "2024"
# rustler 0.38 needs 1.91; harfrust and skrifa need 1.85.
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
name = "pica"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Kept on the same minor as the Hex package `rustler` in mix.exs.
rustler = "0.38.0"
# Font tables, read straight from the bytes (Google Fonts' fontations); harfrust builds on 0.46.
read-fonts = "0.46.0"
# Glyph metrics, the character map and outlines, on the same read-fonts.
skrifa = "0.49.0"
# HarfBuzz's shaping, ported to Rust by the HarfBuzz project, on read-fonts 0.46.
harfrust = "0.15.0"
# WOFF and WOFF2 decoding to a plain font; its default features bring brotli and zlib.
wuff = "0.2.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
